update.html" scrolling="no" style="display:block;width:100%;height:0;border:0;margin:0;padding:0;overflow:hidden;"></iframe> <iframe id="raven-anim" src="/SSM_Story/assets/html/raven_recurrent_matrix_update.html" scrolling="no" style="display:block;width:100%;height:0;border:0;margin:0;padding:0;overflow:hidden;"></iframe> </div> <div style="margin:1.5rem 0 0; padding:0;"> <iframe id="cmp-anim" src="/SSM_Story/assets/html/comparison_matrix_update.html" scrolling="no" style="display:block;width:100%;height:0;border:0;margin:0;padding:0;overflow:hidden;"></iframe> </div> <script>
  // ── Auto-resize all iframes ──────────────────────────────────────
  ['ssm-anim','swa-anim','raven-anim','cmp-anim'].forEach(id => {
    const f = document.getElementById(id);
    if (!f) return;
    const resize = () => {
      try {
        const doc = f.contentDocument || f.contentWindow?.document;
        if (!doc || !doc.body) return;
        f.style.height = Math.max(doc.body.scrollHeight, doc.documentElement.scrollHeight) + 'px';
      } catch(e) {}
    };
    f.addEventListener('load', () => { resize(); setTimeout(resize,250); setTimeout(resize,1000); });
    window.addEventListener('resize', resize);
  });

  // ── Sync conductor for SSM / SWA / Raven ────────────────────────
  // Each iframe pauses at its move point waiting for 'sync-move'.
  // The parent sends 'sync-play' then fires 'sync-move' at exactly
  // MOVE_DELAY ms later — guaranteeing all three move simultaneously.
  const SYNC_IDS  = ['ssm-anim','swa-anim','raven-anim'];
  const SYNC_SRCS = new Set(['ssm','swa','raven']);
  const MOVE_DELAY = 1500; // ms after sync-play when move fires

  const readySet = new Set();
  const doneSet  = new Set();
  let syncStarted = false;

  function sendToAll(msg) {
    SYNC_IDS.forEach(id => {
      const f = document.getElementById(id);
      if (f && f.contentWindow) f.contentWindow.postMessage(msg, '*');
    });
  }

  function startCycle() {
    sendToAll({type: 'sync-play'});
    // Fire sync-move at the exact same moment for all three
    setTimeout(() => sendToAll({type: 'sync-move'}), MOVE_DELAY);
  }

  window.addEventListener('message', e => {
    if (!e.data || !SYNC_SRCS.has(e.data.src)) return;

    if (e.data.type === 'cycle-ready') {
      readySet.add(e.data.src);
      if (readySet.size === 3 && !syncStarted) {
        syncStarted = true;
        setTimeout(startCycle, 400);
      }
    }

    if (e.data.type === 'cycle-done') {
      doneSet.add(e.data.src);
      if (doneSet.size === 3) {
        doneSet.clear();
        setTimeout(startCycle, 500);
      }
    }
  });
</script> </d-article> <d-appendix> <d-footnote-list></d-footnote-list> <d-citation-list></d-citation-list> </d-appendix> <d-bibliography src="/SSM_Story/assets/bibliography/2018-12-22-distill.bib"></d-bibliography> </div> <footer class="fixed-bottom" role="contentinfo"> <div class="container mt-0"> © Copyright 2026 Story Blog. </div> </footer> <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script> <script src="/SSM_Story/assets/js/bootstrap.bundle.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/mdbootstrap@4.20.0/js/mdb.min.js" integrity="sha256-NdbiivsvWt7VYCt6hYNT3h/th9vSTL4EDWeGs5SN3DA=" crossorigin="anonymous"></script> <script defer src="https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js" integrity="sha256-ZgMyDAIYDYGxbcpJcfUnYwNevG/xi9OHKaR/8GK+jWc=" crossorigin="anonymous"></script> <script defer src="/SSM_Story/assets/js/zoom.js?85ddb88934d28b74e78031fd54cf8308"></script> <script src="/SSM_Story/assets/js/no_defer.js?2781658a0a2b13ed609542042a859126"></script> <script defer src="/SSM_Story/assets/js/common.js?e0514a05c5c95ac1a93a8dfd5249b92e"></script> <script defer src="/SSM_Story/assets/js/copy_code.js?12775fdf7f95e901d7119054556e495f" type="text/javascript"></script> <script defer src="/SSM_Story/assets/js/jupyter_new_tab.js?d9f17b6adc2311cbabd747f4538bb15f"></script> <script defer type="text/javascript" id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js" integrity="sha256-MASABpB4tYktI2Oitl4t+78w/lyA+D7b/s9GEP0JOGI=" crossorigin="anonymous"></script> <script src="/SSM_Story/assets/js/mathjax-setup.js?a5bb4e6a542c546dd929b24b8b236dfd"></script> <script defer src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6" crossorigin="anonymous"></script> <script defer src="/SSM_Story/assets/js/progress-bar.js?2f30e0e6801ea8f5036fa66e1ab0a71a" type="text/java
