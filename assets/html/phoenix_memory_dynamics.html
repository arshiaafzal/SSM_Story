<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phoenix Memory Dynamics</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1e293b;
      padding: 0.5rem 0.25rem 0.5rem;
    }

    /* ── Token ticker ── */
    .ticker-wrap {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 0.5rem 0.75rem;
      margin-bottom: 0.75rem;
      display: flex;
      flex-wrap: wrap;
      gap: 2px 1px;
      align-items: center;
    }
    .tok {
      display: inline-block;
      padding: 2px 4px;
      border-radius: 4px;
      font-size: 0.68rem;
      font-family: 'SFMono-Regular', 'Consolas', 'Liberation Mono', monospace;
      color: #94a3b8;
      border: 1px solid transparent;
      transition: background 0.12s, color 0.12s;
      white-space: pre;
    }
    .tok.cur-needle  { background:#fee2e2; color:#b91c1c; border-color:#fca5a5; font-weight:700; transform:scale(1.08); }
    .tok.cur-ctx     { background:#dcfce7; color:#15803d; border-color:#86efac; font-weight:700; transform:scale(1.08); }
    .tok.past-needle { background:#fef2f2; color:#ef4444; }
    .tok.past-ctx    { background:#f0fdf4; color:#22c55e; }

    /* ── Two-panel grid ── */
    .panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    .panel { min-width: 0; }
    .panel-title {
      text-align: center;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #475569;
      margin-bottom: 0.35rem;
      text-transform: uppercase;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
    }

    /* ── Controls ── */
    .controls {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 0.65rem;
      padding: 0.45rem 0.75rem;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
    }
    .play-btn {
      padding: 0.22rem 0.65rem;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #fff;
      font-size: 0.72rem;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .play-btn:hover { background: #f1f5f9; }
    input[type=range] { accent-color: #3b82f6; }
    #scrubber { flex: 1; }
    #speed    { flex: 0 0 55px; }
    .ctrl-lbl {
      font-size: 0.68rem;
      color: #94a3b8;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #step-lbl {
      font-size: 0.7rem;
      color: #64748b;
      white-space: nowrap;
      min-width: 70px;
      text-align: right;
      flex-shrink: 0;
    }

    /* ── Legend ── */
    .legend {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.25rem 1.1rem;
      margin-top: 0.55rem;
    }
    .leg { display: flex; align-items: center; gap: 0.28rem; font-size: 0.7rem; color: #475569; }
    .dot { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }
  </style>
</head>
<body>

<div class="ticker-wrap" id="ticker"></div>

<div class="panels">
  <div class="panel"><div class="panel-title" id="t0"></div><canvas id="c0"></canvas></div>
  <div class="panel"><div class="panel-title" id="t1"></div><canvas id="c1"></canvas></div>
</div>

<div class="controls">
  <button class="play-btn" id="playBtn">&#9654; Play</button>
  <input type="range" id="scrubber" min="0" max="58" value="0" step="1">
  <span id="step-lbl">Token 1 / 59</span>
  <span class="ctrl-lbl">Speed</span>
  <input type="range" id="speed" min="1" max="10" value="4">
</div>

<div class="legend">

  <div class="leg"><div class="dot" style="background:#e8edf2;border:1px solid #cbd5e1"></div>Unwritten</div>
</div>

// ── Draw one canvas frame ──
function drawHead(hi, step) {
  const { ctx } = canvases[hi];
  const frame = DATA.heads[hi].frames[step];
  ctx.clearRect(0, 0, CW, CH);
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const idx = row * COLS + col;
      const cat = frame[idx] || 0;
      ctx.globalAlpha = cat === 0 ? 0.3 : 1.0;
      ctx.fillStyle = COLORS[cat];
      ctx.fillRect(col * STEP, row * STEP, CELL, CELL);
    }
  }
  ctx.globalAlpha = 1.0;
}

// ── Render at step ──
let step = 0;
function render() {
  // ticker
  for (let i = 0; i < nTok; i++) {
    const el = document.getElementById('tok' + i);
    const n  = needleSet.has(i);
    if      (i === step)  el.className = 'tok ' + (n ? 'cur-needle'  : 'cur-ctx');
    else if (i  <  step)  el.className = 'tok ' + (n ? 'past-needle' : 'past-ctx');
    else                  el.className = 'tok';
  }
  // scroll current token into view inside ticker
  const curEl = document.getElementById('tok' + step);
  if (curEl) curEl.scrollIntoView({ block:'nearest', inline:'nearest', behavior:'smooth' });

  drawHead(0, step);
  drawHead(1, step);
  document.getElementById('step-lbl').textContent = 'Token ' + (step+1) + ' / ' + nTok;
  document.getElementById('scrubber').value = step;
}

// ── Animation ──
let playing = false, animId = null, lastTs = 0;

function tick(ts) {
  if (!playing) return;
  const delay = Math.max(40, 820 - parseInt(document.getElementById('speed').value) * 75);
  if (ts - lastTs >= delay) {
    step++;
    if (step >= nTok) { step = nTok - 1; stop(); render(); return; }
    render();
    lastTs = ts;
  }
  animId = requestAnimationFrame(tick);
}

function stop() {
  playing = false;
  if (animId) cancelAnimationFrame(animId);
  document.getElementById('playBtn').innerHTML = '&#9654; Play';
}

document.getElementById('playBtn').addEventListener('click', () => {
  if (playing) { stop(); return; }
  if (step >= nTok - 1) step = 0;
  playing = true;
  document.getElementById('playBtn').innerHTML = '&#9646;&#9646; Pause';
  lastTs = 0;
  animId = requestAnimationFrame(tick);
});

document.getElementById('scrubber').addEventListener('input', e => {
  stop();
  step = parseInt(e.target.value);
  render();
});

render();
</script>
</body>
