<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phoenix Memory Dynamics</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1e293b;
      padding: 0.4rem 0.25rem 0.5rem;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.4rem;
      gap: 0.5rem;
    }
    .head-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #475569;
    }
    .tok-pill {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.7rem;
      color: #64748b;
    }
    .tok-badge {
      display: inline-block;
      padding: 0.13rem 0.5rem;
      border-radius: 5px;
      font-family: 'SFMono-Regular','Consolas',monospace;
      font-weight: 700;
      font-size: 0.74rem;
      min-width: 4.5rem;
      text-align: center;
    }
    .tok-badge.needle { background:#fee2e2; color:#b91c1c; border:1px solid #fca5a5; }
    .tok-badge.ctx    { background:#f0fdf4; color:#15803d; border:1px solid #86efac; }

    /* canvas wrapper */
    .canvas-wrap {
      position: relative;
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      line-height: 0;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
    }
    /* Cursor line tracks the current token row */
    #cursor-line {
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      background: rgba(15,23,42,0.7);
      pointer-events: none;
    }

    .axis-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.6rem;
      color: #94a3b8;
      margin-top: 0.12rem;
      padding: 0 2px;
      letter-spacing: 0.02em;
    }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
      padding: 0.38rem 0.6rem;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
    }
    .play-btn {
      padding: 0.18rem 0.55rem;
      border-radius: 5px;
      border: 1px solid #cbd5e1;
      background: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .play-btn:hover { background: #f1f5f9; }
    input[type=range] { accent-color: #3b82f6; }
    #scrubber { flex: 1; }
    #speed    { flex: 0 0 50px; }
    .ctrl-lbl { font-size: 0.65rem; color: #94a3b8; white-space: nowrap; flex-shrink: 0; }
    #step-lbl { font-size: 0.68rem; color: #64748b; white-space: nowrap; min-width: 54px; text-align: right; flex-shrink: 0; }

    /* Legend */
    .legend {
      display: flex;
      justify-content: center;
      gap: 1.1rem;
      margin-top: 0.45rem;
      flex-wrap: wrap;
    }
    .leg { display: flex; align-items: center; gap: 0.28rem; font-size: 0.68rem; color: #475569; }
    .dot { width: 24px; height: 9px; border-radius: 2px; flex-shrink: 0; }

    /* Token ticker */
    .ticker-wrap {
      margin-top: 0.5rem;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 0.38rem 0.6rem;
      display: flex;
      flex-wrap: wrap;
      gap: 2px 0;
      align-items: center;
    }
    .tok {
      display: inline-block;
      padding: 1px 3px;
      border-radius: 3px;
      font-size: 0.64rem;
      font-family: 'SFMono-Regular','Consolas',monospace;
      color: #94a3b8;
      border: 1px solid transparent;
      white-space: pre;
      transition: background 0.1s, color 0.1s;
    }
    .tok.cur-n  { background:#fee2e2; color:#b91c1c; border-color:#fca5a5; font-weight:700; }
    .tok.cur-c  { background:#dcfce7; color:#15803d; border-color:#86efac; font-weight:700; }
    .tok.done-n { background:#fef2f2; color:#ef4444; }
    .tok.done-c { background:#f0fdf4; color:#22c55e; }
  </style>
</head>
<body>

<div class="header">
  <span class="head-label" id="head-label"></span>
  <div class="tok-pill">
    <span class="ctrl-lbl">current →</span>
    <span class="tok-badge ctx" id="tok-badge">&nbsp;</span>
  </div>
</div>

<div class="canvas-wrap" id="canvas-wrap">
  <canvas id="canvas"></canvas>
  <div id="cursor-line" style="top:0"></div>
</div>

<div class="axis-row">
  <span>← retrieval slots</span>
  <span>shared (blue)</span>
  <span>context slots →</span>
</div>

<div class="controls">
  <button class="play-btn" id="playBtn">&#9654; Play</button>
  <input type="range" id="scrubber" min="0" max="58" value="0" step="1">
  <span id="step-lbl">1 / 59</span>
  <span class="ctrl-lbl">Speed</span>
  <input type="range" id="speed" min="1" max="10" value="5">
</div>

<div class="legend">
  <div class="leg">
    <div class="dot" style="background:linear-gradient(90deg,#fddede,#c0392b)"></div>
    Retrieval slot (passkey writes)
  </div>
  <div class="leg">
    <div class="dot" style="background:linear-gradient(90deg,#d8eef8,#2980b9)"></div>
    Shared slot (both)
  </div>
  <div class="leg">
    <div class="dot" style="background:linear-gradient(90deg,#d9f0e5,#27ae60)"></div>
    Context slot
  </div>
  <div class="leg">
    <div class="dot" style="background:#eaecf1;border:1px solid #d1d5db"></div>
    Unwritten
  </div>
</div>

<div class="ticker-wrap" id="ticker"></div>

// ── Layout constants ──
const N_SLOTS = DATA.n_slots;          // 512
const N_TOKS  = DATA.tokens.length;    // 59
const PX_SLOT = 2;                     // horizontal pixels per slot
const ROW_H   = 9;                     // vertical pixels per token
const CW = N_SLOTS * PX_SLOT;         // 1024
const CH = N_TOKS  * ROW_H;           // 531

// ── Colors: [base (intensity=0), full (intensity=1)] per slot type ──
// slot types: 0=unused, 1=red, 2=green, 3=blue
const BASE = [
  [234, 236, 241],   // unused  base  (#eaecf1)
  [253, 222, 222],   // red     base  (#fddede)
  [217, 240, 229],   // green   base  (#d9f0e5)
  [216, 238, 248],   // blue    base  (#d8eef8)
];
const FULL = [
  [180, 185, 195],   // unused  full  (muted gray)
  [192,  57,  43],   // red     full  (#c0392b)
  [ 39, 174,  96],   // green   full  (#27ae60)
  [ 41, 128, 185],   // blue    full  (#2980b9)
];

function lerp(a, b, t) { return Math.round(a + (b - a) * t); }

// ── Pre-compute full ImageData ──
const canvas = document.getElementById('canvas');
canvas.width  = CW;
canvas.height = CH;
const ctx = canvas.getContext('2d');
document.getElementById('head-label').textContent = DATA.head_label;

const imgFull = ctx.createImageData(CW, CH);
const px = imgFull.data;

const needleSet = new Set(DATA.needle_indices);

for (let ti = 0; ti < N_TOKS; ti++) {
  const ints = DATA.rows[ti];       // 512 intensity values 0-255
  const types = DATA.slot_types;    // 512 slot classifications

  for (let si = 0; si < N_SLOTS; si++) {
    const t_norm = ints[si] / 255;
    const stype  = types[si];
    const base   = BASE[stype];
    const full   = FULL[stype];
    const r = lerp(base[0], full[0], t_norm);
    const g = lerp(base[1], full[1], t_norm);
    const b = lerp(base[2], full[2], t_norm);

    const x0 = si * PX_SLOT;
    for (let py = ti * ROW_H; py < (ti + 1) * ROW_H; py++) {
      for (let dx = 0; dx < PX_SLOT; dx++) {
        const idx = (py * CW + x0 + dx) * 4;
        px[idx]   = r;
        px[idx+1] = g;
        px[idx+2] = b;
        px[idx+3] = 255;
      }
    }
  }
}

// ── Token ticker ──
const ticker = document.getElementById('ticker');
DATA.tokens.forEach((tok, i) => {
  const sp = document.createElement('span');
  sp.className = 'tok';
  sp.textContent = tok === '<s>' ? '⟨s⟩' : tok.replace(/^▁/, ' ');
  sp.id = 'tk' + i;
  ticker.appendChild(sp);
});

// ── Render ──
let step = 0;

function render() {
  // Revealed rows
  ctx.putImageData(imgFull, 0, 0, 0, 0, CW, (step + 1) * ROW_H);

  // Future rows — ghost tint of the slot classification
  const futY = (step + 1) * ROW_H;
  if (futY < CH) {
    // Draw base-color tint for future rows (so you can see the slot layout)
    const ghostImg = ctx.createImageData(CW, CH - futY);
    const gx = ghostImg.data;
    for (let ti = step + 1; ti < N_TOKS; ti++) {
      for (let si = 0; si < N_SLOTS; si++) {
        const stype = DATA.slot_types[si];
        const base  = BASE[stype];
        const x0 = si * PX_SLOT;
        for (let py = (ti - step - 1) * ROW_H; py < (ti - step) * ROW_H; py++) {
          for (let dx = 0; dx < PX_SLOT; dx++) {
            const idx = (py * CW + x0 + dx) * 4;
            gx[idx]   = base[0];
            gx[idx+1] = base[1];
            gx[idx+2] = base[2];
            gx[idx+3] = 200;  // slightly transparent
          }
        }
      }
    }
    ctx.putImageData(ghostImg, 0, futY);

    // dashed separator line
    ctx.save();
    ctx.strokeStyle = 'rgba(51,65,85,0.35)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 5]);
    ctx.beginPath(); ctx.moveTo(0, futY); ctx.lineTo(CW, futY); ctx.stroke();
    ctx.restore();
  }

  // Cursor line
  const topPct = ((step + 0.5) * ROW_H / CH * 100).toFixed(2);
  document.getElementById('cursor-line').style.top = topPct + '%';

  // Badge
  const tok  = DATA.tokens[step];
  const isN  = needleSet.has(step);
  const badge = document.getElementById('tok-badge');
  badge.textContent = tok === '<s>' ? '⟨s⟩' : tok.replace(/^▁/, ' ');
  badge.className   = 'tok-badge ' + (isN ? 'needle' : 'ctx');

  // Controls
  document.getElementById('step-lbl').textContent = (step+1) + ' / ' + N_TOKS;
  document.getElementById('scrubber').value = step;

  // Ticker
  for (let i = 0; i < N_TOKS; i++) {
    const el = document.getElementById('tk' + i);
    const n  = needleSet.has(i);
    if      (i === step) el.className = 'tok ' + (n ? 'cur-n'  : 'cur-c');
    else if (i  <  step) el.className = 'tok ' + (n ? 'done-n' : 'done-c');
    else                 el.className = 'tok';
  }
  const ce = document.getElementById('tk' + step);
  if (ce) ce.scrollIntoView({ block:'nearest', inline:'nearest', behavior:'smooth' });
}

// ── Animation ──
let playing = false, animId = null, lastTs = 0;

function stop() {
  playing = false;
  if (animId) cancelAnimationFrame(animId);
  document.getElementById('playBtn').innerHTML = '&#9654; Play';
}
function tick(ts) {
  if (!playing) return;
  const delay = Math.max(30, 750 - parseInt(document.getElementById('speed').value) * 68);
  if (ts - lastTs >= delay) {
    step++;
    if (step >= N_TOKS) { step = N_TOKS-1; stop(); render(); return; }
    render();
    lastTs = ts;
  }
  animId = requestAnimationFrame(tick);
}

document.getElementById('playBtn').addEventListener('click', () => {
  if (playing) { stop(); return; }
  if (step >= N_TOKS - 1) step = 0;
  playing = true;
  document.getElementById('playBtn').innerHTML = '&#9646;&#9646; Pause';
  lastTs = 0;
  animId = requestAnimationFrame(tick);
});
document.getElementById('scrubber').addEventListener('input', e => {
  stop(); step = parseInt(e.target.value); render();
});

render();
</script>
